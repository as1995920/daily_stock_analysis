[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "us-market-daily-intelligence"
version = "0.1.0"
description = "Personal US market daily intelligence system"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["qa"]
python_files = ["check_*.py"]
addopts = "-q"
